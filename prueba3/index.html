<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Glass AI - Spotlight Style</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-mesh"></div>
  <div class="app-container">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">+ Nuevo Chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <main class="main-content">
      <header class="title-bar">
        <div class="title-text" id="current-chat-title">Glass AI</div>
        <div class="window-controls">
          <button onclick="window.electronAPI.windowControl('minimize')" class="control-btn minimize"></button>
          <button onclick="window.electronAPI.windowControl('maximize')" class="control-btn maximize"></button>
          <button onclick="window.electronAPI.windowControl('close')" class="control-btn close"></button>
        </div>
      </header>

      <section class="chat-container" id="chat-container">
        <div class="chat-wrapper" id="chat-wrapper"></div>
      </section>

      <footer class="input-area">
        <div class="spotlight-bar">
          <div class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <textarea id="message-input" placeholder="Pregunta lo que sea..." rows="1"></textarea>
          <button id="send-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M12 5L5 12M12 5L19 12"/>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
