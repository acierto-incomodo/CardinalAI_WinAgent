<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Glass AI Vision</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-mesh"></div>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">+ Nuevo Chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <p style="font-size: 10px; color: #666; text-align: center; margin-bottom: 10px;">Doble clic en título para renombrar</p>
        <button id="clear-all-btn" class="delete-btn-alt">🗑️ Limpiar Todo</button>
        <button id="open-settings-btn" class="settings-trigger">⚙️ Ajustes de Usuario</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="chat-container" id="chat-container">
        <div class="chat-wrapper" id="chat-wrapper"></div>
      </section>

      <footer class="input-area">
        <div class="input-stack">
          <div id="file-preview-container" class="preview-area"></div>
          <div class="spotlight-bar">
            <button id="attach-btn" class="icon-btn" title="Adjuntar imagen o archivo">📎</button>
            <textarea id="message-input" placeholder="Escribe un mensaje..." rows="1"></textarea>
            <button id="send-btn">↑</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h2>Ajustes de Usuario</h2>
      <div class="setting-item">
        <label>Tu Nombre:</label>
        <input type="text" id="user-name-input" placeholder="Ej: Alex">
      </div>
      <div class="setting-item">
        <label>Instrucciones Personalizadas:</label>
        <textarea id="user-context-input" placeholder="¿Cómo quieres que te responda la IA?"></textarea>
      </div>
      <div class="modal-actions">
        <button id="save-settings-btn">Guardar</button>
        <button id="close-settings-btn">Cerrar</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" style="display:none" accept="image/*,.txt,.js,.py,.html,.css">
  <script src="renderer.js"></script>
</body>
</html>
