<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Glass AI Vision</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-mesh"></div>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">+ Nuevo Chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <p class="sidebar-hint">Doble clic para renombrar</p>
        <button id="clear-all-btn" class="delete-btn-alt">🗑️ Borrar Historial</button>
        <button id="open-settings-btn" class="settings-trigger">⚙️ Ajustes</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="chat-container" id="chat-container">
        <div class="chat-wrapper" id="chat-wrapper"></div>
      </section>

      <footer class="input-area">
        <div class="input-stack">
          <div id="file-preview-container" class="preview-area"></div>
          <div class="spotlight-bar">
            <button id="attach-btn" class="icon-btn">📎</button>
            <textarea id="message-input" placeholder="Escribe aquí..." rows="1" spellcheck="true"></textarea>
            <button id="send-btn">↑</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configuración</h2>
        <p>Personaliza tu experiencia con Glass AI</p>
      </div>
      
      <div class="settings-body">
        <div class="setting-item">
          <label>👤 Tu Nombre o Alias</label>
          <input type="text" id="user-name-input" placeholder="¿Cómo quieres que te llame?">
        </div>

        <div class="setting-item">
          <label>🧠 Instrucciones del Sistema</label>
          <div class="textarea-container">
            <textarea id="user-context-input" class="context-area" placeholder="Ej: Sé conciso, responde siempre en español y usa un tono amigable."></textarea>
            <span class="textarea-hint">Estas instrucciones definen la personalidad de la IA.</span>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button id="close-settings-btn" class="btn-secondary">Cancelar</button>
        <button id="save-settings-btn" class="btn-primary">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" style="display:none" accept="image/*,.txt,.js,.py,.html,.css">
  <script src="renderer.js"></script>
</body>
</html>
